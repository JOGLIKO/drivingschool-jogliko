<title>Missouri Driving Theory Practice</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root{
    --bg:#eef0f1;
    --bg-elevated:#ffffff;
    --ink:#1c2024;
    --ink-soft:#4b545c;
    --hairline:#c9cfd3;
    --hairline-strong:#aeb6bb;
    --accent:#b9800f;
    --accent-strong:#93660c;
    --accent-ink:#1a1200;
    --accent-wash:#f7e8c9;
    --route:#23517f;
    --route-ink:#ffffff;
    --route-soft:#e6edf4;
    --go:#256e3c;
    --go-wash:#e2f0e6;
    --stop:#a02419;
    --stop-wash:#f7e3e1;
    --shadow:0 1px 2px rgba(20,23,27,.08), 0 10px 26px -14px rgba(20,23,27,.30);
    --radius-panel:10px;
    --radius-chip:6px;
    --font-display:'Arial Narrow','Segoe UI Semibold',Arial,sans-serif;
    --font-body:'Segoe UI',system-ui,-apple-system,sans-serif;
    --font-mono:'Consolas','SFMono-Regular',Menlo,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14171b;
      --bg-elevated:#1c2126;
      --ink:#eef1f3;
      --ink-soft:#a7b0b7;
      --hairline:#323a41;
      --hairline-strong:#454f57;
      --accent:#e3ab3c;
      --accent-strong:#f0bd57;
      --accent-ink:#1a1200;
      --accent-wash:#3a2e10;
      --route:#3f7fbf;
      --route-ink:#08131f;
      --route-soft:#1c2c3c;
      --go:#4caf6c;
      --go-wash:#153521;
      --stop:#e0554c;
      --stop-wash:#3a1a17;
      --shadow:0 1px 2px rgba(0,0,0,.5), 0 14px 30px -16px rgba(0,0,0,.7);
    }
  }
  :root[data-theme="dark"]{
    --bg:#14171b; --bg-elevated:#1c2126; --ink:#eef1f3; --ink-soft:#a7b0b7;
    --hairline:#323a41; --hairline-strong:#454f57; --accent:#e3ab3c; --accent-strong:#f0bd57;
    --accent-ink:#1a1200; --accent-wash:#3a2e10; --route:#3f7fbf; --route-ink:#08131f;
    --route-soft:#1c2c3c; --go:#4caf6c; --go-wash:#153521; --stop:#e0554c; --stop-wash:#3a1a17;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 14px 30px -16px rgba(0,0,0,.7);
  }
  :root[data-theme="light"]{
    --bg:#eef0f1; --bg-elevated:#ffffff; --ink:#1c2024; --ink-soft:#4b545c;
    --hairline:#c9cfd3; --hairline-strong:#aeb6bb; --accent:#b9800f; --accent-strong:#93660c;
    --accent-ink:#1a1200; --accent-wash:#f7e8c9; --route:#23517f; --route-ink:#ffffff;
    --route-soft:#e6edf4; --go:#256e3c; --go-wash:#e2f0e6; --stop:#a02419; --stop-wash:#f7e3e1;
    --shadow:0 1px 2px rgba(20,23,27,.08), 0 10px 26px -14px rgba(20,23,27,.30);
  }

  *,*::before,*::after{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--ink); font-family:var(--font-body);
    font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{ font-family:var(--font-display); text-wrap:balance; margin:0; }
  p{margin:0;}
  button{font-family:var(--font-body);}
  .visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);}
  :focus-visible{outline:3px solid var(--accent); outline-offset:2px;}

  /* ---------- shell ---------- */
  .app-header{
    background:var(--route); color:var(--route-ink);
    padding:14px 20px; display:flex; align-items:center; gap:14px;
    box-shadow:var(--shadow); position:sticky; top:0; z-index:10;
  }
  .shield{
    width:38px;height:38px;flex:none;
    background:var(--route-ink); color:var(--route);
    clip-path:polygon(50% 0%,100% 22%,100% 78%,50% 100%,0% 78%,0% 22%);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-display); font-weight:900; font-size:14px; letter-spacing:.02em;
  }
  .app-title{display:flex; flex-direction:column; gap:1px; min-width:0;}
  .app-title .kicker{
    font-size:11px; text-transform:uppercase; letter-spacing:.14em; opacity:.85;
  }
  .app-title h1{font-size:19px; letter-spacing:.02em; text-transform:uppercase;}
  .back-btn{
    margin-left:auto; background:transparent; border:1.5px solid rgba(255,255,255,.5);
    color:var(--route-ink); padding:8px 14px; border-radius:var(--radius-chip);
    font-family:var(--font-display); text-transform:uppercase; letter-spacing:.06em;
    font-size:13px; font-weight:700; cursor:pointer; flex:none;
  }
  [data-theme-toggle]{
    margin-left:auto; background:transparent; border:1.5px solid rgba(255,255,255,.5);
    color:var(--route-ink); padding:8px 10px; border-radius:var(--radius-chip);
    font-size:13px; cursor:pointer; flex:none;
  }
  .header-actions{display:flex; align-items:center; gap:8px; margin-left:auto;}

  main{max-width:900px; margin:0 auto; padding:28px 20px 64px;}

  /* ---------- home ---------- */
  .hero{padding:8px 2px 26px;}
  .hero .eyebrow{
    color:var(--accent-strong); font-size:12px; text-transform:uppercase;
    letter-spacing:.16em; font-weight:700; font-family:var(--font-display);
  }
  .hero h2{font-size:clamp(28px,4vw,40px); margin-top:6px; letter-spacing:.01em;}
  .hero p{color:var(--ink-soft); max-width:60ch; margin-top:10px; font-size:15px;}

  .mode-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:14px; margin-top:20px;}
  .mode-card{
    text-align:left; border:none; border-radius:var(--radius-panel); padding:20px 18px;
    cursor:pointer; box-shadow:var(--shadow); position:relative; overflow:hidden;
    display:flex; flex-direction:column; gap:8px; min-height:150px; color:var(--route-ink);
    background:var(--route); transition:transform .15s ease;
  }
  .mode-card:hover{transform:translateY(-2px);}
  .mode-card:nth-child(2){background:var(--go); color:#fff;}
  .mode-card:nth-child(3){background:var(--accent); color:var(--accent-ink);}
  .mode-card:nth-child(4){background:var(--bg-elevated); color:var(--ink); border:1.5px solid var(--hairline-strong);}
  .mode-card .badge{
    width:30px;height:30px; border-radius:50%; background:rgba(255,255,255,.22);
    display:flex; align-items:center; justify-content:center; font-family:var(--font-display);
    font-weight:800; font-size:13px;
  }
  .mode-card:nth-child(4) .badge{background:var(--route-soft); color:var(--route);}
  .mode-card h3{font-size:20px; text-transform:uppercase; letter-spacing:.02em; margin-top:auto;}
  .mode-card .desc{font-size:13.5px; opacity:.92; line-height:1.4;}

  .disclaimer{
    margin-top:28px; border-left:3px solid var(--accent); background:var(--accent-wash);
    padding:12px 14px; border-radius:0 var(--radius-chip) var(--radius-chip) 0;
    font-size:13px; color:var(--ink-soft);
  }
  .disclaimer strong{color:var(--ink);}

  /* ---------- lists / category picker ---------- */
  .panel{
    background:var(--bg-elevated); border:1px solid var(--hairline); border-radius:var(--radius-panel);
    box-shadow:var(--shadow);
  }
  .cat-list{list-style:none; margin:20px 0 0; padding:0; display:flex; flex-direction:column; gap:10px;}
  .cat-row{
    display:flex; align-items:center; gap:14px; padding:16px 18px; background:var(--bg-elevated);
    border:1px solid var(--hairline); border-radius:var(--radius-panel); cursor:pointer; width:100%;
    text-align:left; color:var(--ink); box-shadow:var(--shadow);
  }
  .cat-row .swatch{width:8px; align-self:stretch; border-radius:4px; background:var(--route); flex:none;}
  .cat-row .cat-name{font-family:var(--font-display); text-transform:uppercase; letter-spacing:.02em; font-size:16px;}
  .cat-row .cat-count{margin-left:auto; font-family:var(--font-mono); font-variant-numeric:tabular-nums; color:var(--ink-soft); font-size:13px;}
  .cat-row .cat-acc{font-family:var(--font-mono); font-variant-numeric:tabular-nums; font-size:13px; color:var(--go); min-width:44px; text-align:right;}

  /* ---------- quiz ---------- */
  .quiz-wrap{max-width:640px; margin:0 auto;}
  .progress-track{display:flex; gap:4px; margin-bottom:22px;}
  .progress-seg{flex:1; height:5px; border-radius:3px; background:var(--hairline);}
  .progress-seg.done{background:var(--route);}
  .progress-seg.current{background:var(--accent);}

  .quiz-meta{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px;}
  .quiz-meta .qnum{font-family:var(--font-mono); font-variant-numeric:tabular-nums; color:var(--ink-soft); font-size:13px;}
  .quiz-meta .qcat{
    font-family:var(--font-display); text-transform:uppercase; font-size:11px; letter-spacing:.1em;
    color:var(--route); background:var(--route-soft); padding:3px 9px; border-radius:20px;
  }

  .question-card{
    background:var(--bg-elevated); border:1px solid var(--hairline); border-radius:var(--radius-panel);
    box-shadow:var(--shadow); padding:26px 24px;
  }
  .question-card h2{font-size:21px; line-height:1.35; font-family:var(--font-body); font-weight:600; text-transform:none; letter-spacing:0;}
  .sign-stage{display:flex; justify-content:center; padding:10px 0 18px;}
  .sign-art{width:132px; height:132px; overflow:visible; filter:drop-shadow(0 3px 5px rgba(0,0,0,.18));}

  .choices{list-style:none; margin:20px 0 0; padding:0; display:flex; flex-direction:column; gap:10px;}
  .choice-btn{
    width:100%; text-align:left; padding:13px 16px; border-radius:var(--radius-chip);
    border:1.5px solid var(--hairline-strong); background:var(--bg-elevated); color:var(--ink);
    font-size:15px; cursor:pointer; display:flex; gap:10px; align-items:flex-start;
  }
  .choice-btn .key{font-family:var(--font-mono); font-weight:700; color:var(--ink-soft); flex:none;}
  .choice-btn .choice-text{flex:1;}
  .choice-btn .mark{
    flex:none; margin-left:auto; font-weight:900; font-size:17px; line-height:1; width:22px; text-align:center;
  }
  .choice-btn:hover:not(:disabled){border-color:var(--route);}
  .choice-btn:disabled{cursor:default;}
  .choice-btn.correct{background:var(--go-wash); border-color:var(--go); color:var(--ink);}
  .choice-btn.correct .key{color:var(--go);}
  .choice-btn.correct .mark{color:var(--go);}
  .choice-btn.incorrect{background:var(--stop-wash); border-color:var(--stop); color:var(--ink);}
  .choice-btn.incorrect .key{color:var(--stop);}
  .choice-btn.incorrect .mark{color:var(--stop);}

  .explain{
    margin-top:18px; padding:14px 16px; border-radius:var(--radius-chip);
    border-left:4px solid var(--route); background:var(--route-soft); font-size:14px; color:var(--ink);
  }
  .explain.go{border-color:var(--go); background:var(--go-wash);}
  .explain.stop{border-color:var(--stop); background:var(--stop-wash);}
  .explain .label{
    font-family:var(--font-display); text-transform:uppercase; letter-spacing:.08em; font-size:11.5px;
    display:block; margin-bottom:4px; color:var(--ink-soft);
  }

  .quiz-actions{display:flex; justify-content:flex-end; margin-top:20px;}
  .primary-btn{
    background:var(--accent); color:var(--accent-ink); border:none; padding:12px 22px;
    border-radius:var(--radius-chip); font-family:var(--font-display); text-transform:uppercase;
    letter-spacing:.05em; font-weight:800; font-size:14px; cursor:pointer;
  }
  .primary-btn:hover{background:var(--accent-strong);}
  .ghost-btn{
    background:transparent; color:var(--route); border:1.5px solid var(--route); padding:10px 18px;
    border-radius:var(--radius-chip); font-family:var(--font-display); text-transform:uppercase;
    letter-spacing:.05em; font-weight:700; font-size:13px; cursor:pointer;
  }

  /* ---------- results ---------- */
  .results-card{text-align:center; padding:40px 24px;}
  .score-big{font-family:var(--font-mono); font-variant-numeric:tabular-nums; font-size:56px; font-weight:700; color:var(--route);}
  .score-big small{font-size:22px; color:var(--ink-soft); font-weight:400;}
  .results-actions{display:flex; gap:10px; justify-content:center; margin-top:22px; flex-wrap:wrap;}

  /* ---------- sign learn/test tabs ---------- */
  .tabbar{display:flex; gap:8px; margin-top:18px; border-bottom:1px solid var(--hairline);}
  .tab-btn{
    background:transparent; border:none; padding:10px 4px; margin-right:18px; cursor:pointer;
    font-family:var(--font-display); text-transform:uppercase; letter-spacing:.06em; font-size:14px;
    color:var(--ink-soft); border-bottom:3px solid transparent;
  }
  .tab-btn.active{color:var(--ink); border-bottom-color:var(--accent);}

  .sign-grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:12px; margin-top:18px;
  }
  .sign-tile{
    background:var(--bg-elevated); border:1px solid var(--hairline); border-radius:var(--radius-panel);
    padding:14px 10px; box-shadow:var(--shadow); cursor:pointer; text-align:left;
  }
  .sign-tile .sign-art{width:64px;height:64px; margin:0 auto;}
  .sign-tile .sign-name{
    font-family:var(--font-display); text-transform:uppercase; font-size:12.5px; text-align:center;
    margin-top:8px; letter-spacing:.01em;
  }
  .sign-detail{margin-top:16px; padding:16px 18px;}
  .sign-detail-head{display:flex; align-items:center; gap:14px;}
  .sign-detail-head .sign-art{width:70px;height:70px;}
  .sign-detail-head h3{font-size:18px; text-transform:uppercase; letter-spacing:.01em;}
  .sign-detail-head .cat-pill{
    font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-soft);
  }
  .sign-detail p{margin-top:10px; font-size:14.5px; color:var(--ink-soft); max-width:56ch;}

  /* ---------- progress view ---------- */
  .stat-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-top:20px;}
  .stat-card{
    background:var(--bg-elevated); border:1px solid var(--hairline); border-radius:var(--radius-panel);
    padding:16px 18px; box-shadow:var(--shadow);
  }
  .stat-card .stat-label{font-size:11.5px; text-transform:uppercase; letter-spacing:.1em; color:var(--ink-soft);}
  .stat-card .stat-value{font-family:var(--font-mono); font-variant-numeric:tabular-nums; font-size:30px; margin-top:4px;}

  .meter-list{margin-top:24px; display:flex; flex-direction:column; gap:14px;}
  .meter-row .meter-top{display:flex; justify-content:space-between; font-size:13.5px; margin-bottom:6px;}
  .meter-row .meter-top .pct{font-family:var(--font-mono); font-variant-numeric:tabular-nums; color:var(--ink-soft);}
  .meter-track{height:8px; background:var(--hairline); border-radius:4px; overflow:hidden;}
  .meter-fill{height:100%; background:var(--accent); border-radius:4px; transition:width .4s ease;}

  .history-wrap{margin-top:26px; overflow-x:auto;}
  table.history{width:100%; border-collapse:collapse; font-size:13.5px;}
  table.history th{
    text-align:left; font-family:var(--font-display); text-transform:uppercase; letter-spacing:.06em;
    font-size:11px; color:var(--ink-soft); padding:8px 10px; border-bottom:1.5px solid var(--hairline-strong);
  }
  table.history td{padding:9px 10px; border-bottom:1px solid var(--hairline); font-variant-numeric:tabular-nums;}
  table.history tbody tr:last-child td{border-bottom:none;}
  table.history tfoot td{border-top:1.5px solid var(--hairline-strong); border-bottom:none; padding-top:10px;}
  .empty-note{color:var(--ink-soft); font-size:14px; margin-top:18px;}

  .reset-row{margin-top:26px; display:flex; justify-content:flex-end;}
  .danger-btn{
    background:transparent; border:1.5px solid var(--stop); color:var(--stop); padding:9px 16px;
    border-radius:var(--radius-chip); font-family:var(--font-display); text-transform:uppercase;
    font-size:12.5px; letter-spacing:.05em; cursor:pointer;
  }

  @media (prefers-reduced-motion:reduce){
    .mode-card, .meter-fill{transition:none;}
  }

  .app-footer{
    max-width:900px; margin:0 auto; padding:0 20px 32px; text-align:center;
    font-family:var(--font-display); text-transform:uppercase; letter-spacing:.12em;
    font-size:11.5px; color:var(--ink-soft);
  }
</style>

<header class="app-header">
  <div class="shield">MO</div>
  <div class="app-title">
    <span class="kicker">Practice permit study</span>
    <h1 id="header-title">Missouri Driving Theory</h1>
  </div>
  <div class="header-actions">
    <button class="back-btn" id="back-btn" hidden type="button">&larr; Home</button>
    <button data-theme-toggle id="theme-toggle" type="button" title="Toggle color theme" aria-label="Toggle color theme">&#9788;</button>
  </div>
</header>

<main id="app" aria-live="polite"></main>
<footer class="app-footer">Made by Jogliko</footer>

<script>
(function(){
  "use strict";

  /* ============ theme toggle ============ */
  var themeBtn = document.getElementById('theme-toggle');
  themeBtn.addEventListener('click', function(){
    var root = document.documentElement;
    var cur = root.getAttribute('data-theme');
    var next = cur === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
  });

  /* ============ sign art helpers ============ */
  var OCT = "29,6 71,6 94,29 94,71 71,94 29,94 6,71 6,29";
  var TRI_DOWN = "6,16 94,16 50,92";
  var DIA = "50,4 96,50 50,96 4,50";
  var PEN = "50,4 95,38 78,94 22,94 5,38";

  function octagon(fill,stroke){ return '<polygon points="'+OCT+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="5"/>'; }
  function triDown(fill,stroke){ return '<polygon points="'+TRI_DOWN+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="5"/>'; }
  function diamond(fill,stroke){ return '<polygon points="'+DIA+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="5"/>'; }
  function pentagon(fill,stroke){ return '<polygon points="'+PEN+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="5"/>'; }
  function circleShape(fill,stroke){ return '<circle cx="50" cy="50" r="45" fill="'+fill+'" stroke="'+stroke+'" stroke-width="5"/>'; }
  function rectShape(fill,stroke,rx){ return '<rect x="6" y="22" width="88" height="56" rx="'+(rx||6)+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="5"/>'; }
  function txt(str,size,y,fill,weight){
    return '<text x="50" y="'+(y||58)+'" font-size="'+(size||20)+'" font-weight="'+(weight||800)+
      '" fill="'+fill+'" text-anchor="middle" font-family="Arial Narrow, Arial, sans-serif">'+str+'</text>';
  }
  function slash(){ return '<line x1="16" y1="16" x2="84" y2="84" stroke="#a02419" stroke-width="8" stroke-linecap="round"/>'; }
  function svgWrap(inner){ return '<svg viewBox="0 0 100 100" class="sign-art" aria-hidden="true">'+inner+'</svg>'; }

  var W='#ffffff', BLK='#111111', RED='#b3241c', YEL='#f3c623', YELGRN='#cbe11e', ORANGE='#f28c1e', BLUE='#1f4d7a', GRN='#0f6b3f';

  var SIGNS = [
    {id:'stop', name:'Stop', cat:'Regulatory', meaning:'Come to a complete stop and yield to cross traffic and pedestrians before proceeding. The eight-sided shape means "stop" even if the sign is faded or obscured.',
      art: svgWrap(octagon(RED,W)+txt('STOP',22,58,W,900))},
    {id:'yield', name:'Yield', cat:'Regulatory', meaning:'Slow down and be ready to stop if needed to let crossing or oncoming traffic and pedestrians go first.',
      art: svgWrap(triDown(W,RED)+txt('YIELD',15,66,RED,900))},
    {id:'do-not-enter', name:'Do Not Enter', cat:'Regulatory', meaning:'You may not enter the roadway from this direction — often the exit side of a one-way ramp or divided road.',
      art: svgWrap(circleShape(RED,RED)+'<rect x="18" y="44" width="64" height="12" fill="'+W+'"/>')},
    {id:'wrong-way', name:'Wrong Way', cat:'Regulatory', meaning:'You are heading against the flow of traffic. Stop safely, do not continue, and reverse direction when it is safe.',
      art: svgWrap(rectShape(RED,W,4)+txt('WRONG',16,48,W,900)+txt('WAY',16,68,W,900))},
    {id:'speed-limit', name:'Speed Limit', cat:'Regulatory', meaning:'Shows the maximum legal speed for that stretch of road under good conditions. Slower may be required in poor weather or traffic.',
      art: svgWrap(rectShape(W,BLK,6)+txt('SPEED LIMIT',10,34,BLK,700)+txt('55',30,66,BLK,900))},
    {id:'no-u-turn', name:'No U-Turn', cat:'Regulatory', meaning:'Making a U-turn is prohibited at this location.',
      art: svgWrap(circleShape(W,RED)+'<path d="M30 60 v-14 a14 14 0 0 1 28 0 v10" fill="none" stroke="'+BLK+'" stroke-width="6"/><polygon points="66,44 66,60 78,52" fill="'+BLK+'"/>'+slash())},
    {id:'no-left-turn', name:'No Left Turn', cat:'Regulatory', meaning:'Turning left is prohibited at this intersection or driveway.',
      art: svgWrap(circleShape(W,RED)+'<line x1="26" y1="50" x2="70" y2="50" stroke="'+BLK+'" stroke-width="6"/><polygon points="26,50 40,40 40,60" fill="'+BLK+'"/>'+slash())},
    {id:'no-right-on-red', name:'No Turn On Red', cat:'Regulatory', meaning:'Right turns are not permitted while the signal is red at this intersection.',
      art: svgWrap(rectShape(W,BLK,6)+'<circle cx="50" cy="38" r="12" fill="'+RED+'"/><line x1="30" y1="38" x2="70" y2="38" stroke="'+BLK+'" stroke-width="4"/>'+txt('NO TURN ON RED',9,72,BLK,700))},
    {id:'no-parking', name:'No Parking', cat:'Regulatory', meaning:'Stopping to park is not allowed in this zone.',

  var QUESTION_INDEX = {};
  QUESTIONS.forEach(function(qq){ QUESTION_INDEX[qq.id]=qq; });

  function catName(id){
    var c = CATEGORIES.filter(function(c){return c.id===id;})[0];
    return c ? c.name : id;
  }

  /* ============ persistence ============ */
  var STORE_KEY = 'mo_driving_quiz_v1';
  function loadStore(){
    try{
      var raw = localStorage.getItem(STORE_KEY);
      if(!raw) return {history:[], stats:{}};
      var parsed = JSON.parse(raw);
      return {history: parsed.history||[], stats: parsed.stats||{}};
    }catch(e){ return {history:[], stats:{}}; }
  }
  function saveStore(store){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(store)); }catch(e){}
  }
  var store = loadStore();

  function recordAnswer(questionId, correct){
    if(!store.stats[questionId]) store.stats[questionId] = {correct:0, wrong:0};
    if(correct) store.stats[questionId].correct++; else store.stats[questionId].wrong++;
    saveStore(store);
  }
  function recordAttempt(mode, label, score, total){
    store.history.unshift({date: new Date().toISOString(), mode:mode, label:label, score:score, total:total});
    store.history = store.history.slice(0,50);
    saveStore(store);
  }

  /* ============ view engine ============ */
  var app = document.getElementById('app');
  var backBtn = document.getElementById('back-btn');
  var headerTitle = document.getElementById('header-title');
  backBtn.addEventListener('click', function(){ render('home'); });

  function el(tag, attrs, children){
    var e = document.createElement(tag);
    attrs = attrs || {};
    Object.keys(attrs).forEach(function(k){
      if(k==='html'){ e.innerHTML = attrs[k]; }
      else if(k==='class'){ e.className = attrs[k]; }
      else if(k.indexOf('on')===0 && typeof attrs[k]==='function'){ e.addEventListener(k.slice(2), attrs[k]); }
      else { e.setAttribute(k, attrs[k]); }
    });
    (children||[]).forEach(function(c){
      if(c==null) return;
      if(typeof c === 'string') e.appendChild(document.createTextNode(c));
      else e.appendChild(c);
    });
    return e;
  }
  function shuffle(arr){
    var a = arr.slice();
    for(var i=a.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var t=a[i]; a[i]=a[j]; a[j]=t;
    }
    return a;
  }

  function setHeader(title, showBack){
    headerTitle.textContent = title;
    backBtn.hidden = !showBack;
  }

    else if(view==='signlearn') renderSignTabs('learn');
    else if(view==='signtest') renderSignTabs('test');
    else if(view==='progress') renderProgress();
    window.scrollTo(0,0);
  }

  /* ---- category picker ---- */
  function categoryStats(catId){
    var qs = QUESTIONS.filter(function(q){return q.cat===catId;});
    var correct=0, total=0;
    qs.forEach(function(q){
      var s = store.stats[q.id];
      if(s){ correct += s.correct; total += s.correct+s.wrong; }
    });
    return {count: qs.length, acc: total>0 ? Math.round(100*correct/total) : null};

  /* ---- quiz engine (shared by random / category / sign test) ---- */
  function renderQuizStart(pool, mode, label){
    var questions;
    if(pool==='random'){
      questions = shuffle(QUESTIONS).slice(0,20);
    } else if(pool==='signtest'){
      questions = shuffle(SIGNS).slice(0,20).map(signToQuestion);
    } else {
      questions = shuffle(QUESTIONS.filter(function(q){return q.cat===pool;}));
    }
    runQuiz(questions, mode, label);
  }

  function signToQuestion(sign){
    var others = shuffle(SIGNS.filter(function(s){return s.id!==sign.id;})).slice(0,3);
    var choicesRaw = shuffle([sign].concat(others));
    var correctIdx = choicesRaw.indexOf(sign);
    return {
      id: 'sign-'+sign.id,
      cat: 'Road Signs',
      art: sign.art,
      text: 'What does this sign mean?',
      choices: choicesRaw.map(function(s){ return s.name; }),
      correct: correctIdx,
      explain: sign.meaning
    };
  }

  function runQuiz(questions, mode, label){
    setHeader(label, true);
    var state = { i:0, score:0, answered:false, total: questions.length };

    function renderQuestion(){
      state.answered = false;
      app.innerHTML = '';
      var quizWrap = el('div',{class:'quiz-wrap'});

      var track = el('div',{class:'progress-track'});
      for(var s=0;s<state.total;s++){
        var cls='progress-seg'+(s<state.i?' done':(s===state.i?' current':''));
        track.appendChild(el('div',{class:cls}));
      }
      quizWrap.appendChild(track);

      var cur = questions[state.i];
      var meta = el('div',{class:'quiz-meta'},[
        el('span',{class:'qnum'},['Question '+(state.i+1)+' of '+state.total]),
        el('span',{class:'qcat'},[typeof cur.cat==='string' && cur.cat==='Road Signs' ? 'Road Signs' : catName(cur.cat)])
      ]);
      quizWrap.appendChild(meta);

      var card = el('div',{class:'question-card'});
      if(cur.art){
        card.appendChild(el('div',{class:'sign-stage', html: cur.art}));
      }
      card.appendChild(el('h2',{},[cur.text]));

      var list = el('ul',{class:'choices'});
      var keys = ['A','B','C','D'];
      cur.choices.forEach(function(choice, idx){
        var btn = el('button',{class:'choice-btn'},[
          el('span',{class:'key'},[keys[idx]+'.']),
          el('span',{class:'choice-text'},[choice]),
          el('span',{class:'mark'})
        ]);
        btn.addEventListener('click', function(){ selectAnswer(idx); });
        list.appendChild(el('li',{},[btn]));
      });
      card.appendChild(list);

      var explainHolder = el('div',{id:'explain-holder'});
      card.appendChild(explainHolder);

      var actions = el('div',{class:'quiz-actions'});
      card.appendChild(actions);

      quizWrap.appendChild(card);
      app.appendChild(quizWrap);

      function selectAnswer(idx){
        if(state.answered) return;
        state.answered = true;
        var buttons = list.querySelectorAll('.choice-btn');
        buttons.forEach(function(b,i){
          b.disabled = true;
          var mark = b.querySelector('.mark');
          if(i===cur.correct){ b.classList.add('correct'); mark.textContent='✓'; }
          else if(i===idx){ b.classList.add('incorrect'); mark.textContent='✕'; }
        });
        var isCorrect = idx===cur.correct;
        if(isCorrect) state.score++;
        recordAnswer(cur.id, isCorrect);
        var box = el('div',{class:'explain '+(isCorrect?'go':'stop')},[
          el('span',{class:'label'},[isCorrect ? 'Correct' : 'Not quite']),
          el('span',{},[cur.explain])
        ]);
        explainHolder.appendChild(box);

        var nextBtn = el('button',{class:'primary-btn'},[state.i+1<state.total ? 'Next Question' : 'See Results']);
        nextBtn.addEventListener('click', function(){
          state.i++;
          if(state.i<state.total){ renderQuestion(); }
          else { finishQuiz(); }
        });
        actions.appendChild(nextBtn);
      }
    }

    function finishQuiz(){
      recordAttempt(mode, label, state.score, state.total);
      app.innerHTML = '';
      var pct = Math.round(100*state.score/state.total);
      var card = el('div',{class:'panel results-card'},[
        el('div',{class:'eyebrow'},[label+' — complete']),
        el('div',{class:'score-big'},[state.score+' / '+state.total, el('small',{},['  '+pct+'%'])]),
        el('p',{style:'color:var(--ink-soft); margin-top:14px;'},[
          pct>=85 ? 'Strong result — you’re close to test-ready on this set.' :
          pct>=70 ? 'Solid progress. Review the missed topics and try again.' :
          'Keep practicing this set — review the explanations and retry.'
        ]),
        el('div',{class:'results-actions'},[
          el('button',{class:'primary-btn', onclick:function(){ runQuiz(shuffle(questions), mode, label); }},['Retry This Set']),
          el('button',{class:'ghost-btn', onclick:function(){ render('home'); }},['Back to Home'])
        ])
      ]);
      app.appendChild(card);
    }

    renderQuestion();
  }

      var qids;
      if(c.id==='__signs') qids = SIGNS.map(function(s){return 'sign-'+s.id;});
      else qids = QUESTIONS.filter(function(q){return q.cat===c.id;}).map(function(q){return q.id;});
      var correct=0, total=0;
      qids.forEach(function(id){ var s=store.stats[id]; if(s){correct+=s.correct; total+=s.correct+s.wrong;} });
      var pct = total>0 ? Math.round(100*correct/total) : 0;
      var row = el('div',{class:'meter-row'},[
        el('div',{class:'meter-top'},[el('span',{},[c.name]), el('span',{class:'pct'},[total>0 ? pct+'%' : 'not attempted'])]),
        el('div',{class:'meter-track'},[el('div',{class:'meter-fill', style:'width:'+pct+'%'})])
      ]);
      meterList.appendChild(row);
    });
    wrap.appendChild(meterList);

    var histWrap = el('div',{class:'history-wrap'});
    if(store.history.length===0){
      histWrap.appendChild(el('p',{class:'empty-note'},['No quizzes taken yet — finish one to see your history here.']));
    } else {
      var table = el('table',{class:'history'});
      var thead = el('thead',{},[el('tr',{},[
        el('th',{},['Date']), el('th',{},['Mode']), el('th',{},['Score']), el('th',{},['%'])
      ])]);
      var tbody = el('tbody');
      store.history.forEach(function(h){
        var d = new Date(h.date);
        var dateStr = (d.getMonth()+1)+'/'+d.getDate()+'/'+String(d.getFullYear()).slice(2)+' '+d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
        var pct = Math.round(100*h.score/h.total);
        tbody.appendChild(el('tr',{},[
          el('td',{},[dateStr]),
          el('td',{},[h.label]),
          el('td',{},[h.score+'/'+h.total]),
          el('td',{},[pct+'%'])
        ]));
      });
      table.appendChild(thead);
      table.appendChild(tbody);
      histWrap.appendChild(table);
    }
    wrap.appendChild(histWrap);

    var resetRow = el('div',{class:'reset-row'},[
      el('button',{class:'danger-btn', onclick:function(){
        if(confirm('Clear all saved quiz history and stats? This cannot be undone.')){
          store = {history:[], stats:{}};
          saveStore(store);
          renderProgress();
        }
      }},['Reset Progress'])
    ]);
    wrap.appendChild(resetRow);

    app.appendChild(wrap);
  }

  render('home');
})();
</script>
